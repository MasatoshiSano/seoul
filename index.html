<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ソウル旅行 2026 🇰🇷</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧳</text></svg>" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="hero-flag">🇰🇷 ✈️</p>
      <h1 id="trip-title">ソウル旅行</h1>
      <p class="hero-sub" id="trip-subtitle"></p>
      <p class="hero-note" id="trip-note"></p>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="schedule">📅 日程</button>
    <button class="tab" data-tab="places">📍 行きたい場所</button>
    <button class="tab" data-tab="packing">✅ 持ち物</button>
    <button class="tab" data-tab="booking">✈️💰 予約 &amp; 予算</button>
  </nav>

  <main>
    <section id="schedule" class="panel active"></section>
    <section id="places" class="panel"></section>
    <section id="packing" class="panel"></section>
    <section id="booking" class="panel"></section>
  </main>

  <footer class="foot">
    <p>データは <code>data/*.json</code> を編集すると更新できます 📝</p>
    <p class="foot-dim">Have a nice trip! 🎉</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
